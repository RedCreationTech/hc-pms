name: HC-PMS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.4.1618
      - name: PMS domain and API tests on fresh SQLite
        run: clojure -M:test -d test/clj -r 'com.ruoyi.pms.*-test'
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pms_ci_only
          MYSQL_DATABASE: hc_pms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppms_ci_only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.4.1618
      - name: Same PMS tests on isolated MySQL
        env:
          PMS_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/hc_pms_test?user=root&password=pms_ci_only&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        run: clojure -M:test -d test/clj -r 'com.ruoyi.pms.*-test'
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.4.1618
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec shadow-cljs release app
      - run: pnpm exec playwright install --with-deps chrome
      - name: Start isolated application for browser tests
        env:
          PORT: '3100'
          HTTP_HOST: 127.0.0.1
          NREPL_PORT: '0'
          FLOWABLE_ASYNC: 'false'
        run: |
          clojure -M:dev -m com.ruoyi.core > /tmp/pms-ci.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/pms-ci.log
          exit 1
      - name: Real browser project workflows
        env:
          BASE_URL: http://127.0.0.1:3100
        run: pnpm exec playwright test tests/e2e/pms.spec.js tests/e2e/pms-workbench.spec.js --project=chromium
      - name: Preserve application diagnostics
        if: always()
        run: |
          mkdir -p playwright-report
          if [ -f /tmp/pms-ci.log ]; then cp /tmp/pms-ci.log playwright-report/application.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pms-browser-report
          path: playwright-report/
